<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KanaType JLPT · N1-N5 日语单词与语法全能打字训练</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');

    body {
      font-family: 'Inter', 'Noto Sans SC', 'Noto Sans JP', sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .jp-font { font-family: 'Noto Sans JP', sans-serif; }
    .mono-font { font-family: 'JetBrains Mono', monospace; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.3s ease-in-out; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- 顶部导航栏 -->
  <header class="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- Logo & 主视图切换 -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20 jp-font text-lg">
          あ
        </div>
        <div>
          <h1 class="font-bold text-slate-100 tracking-tight text-base flex items-center gap-2">
            KanaType <span class="text-[11px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-medium">JLPT N1-N5</span>
          </h1>
          <p id="netStatusText" class="text-[11px] text-emerald-400">● 正在同步云端全量词库...</p>
        </div>
      </div>

      <!-- 主导航：打字练习 vs 词库与语法浏览 -->
      <nav class="flex bg-slate-800/90 p-1 rounded-xl border border-slate-700/60">
        <button onclick="switchMainView('practice')" id="nav-practice" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shadow">
          ⌨️ 打字练习
        </button>
        <button onclick="switchMainView('browse')" id="nav-browse" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-300 hover:text-white flex items-center gap-1.5">
          📚 词库与语法浏览 <span id="totalCountBadge" class="bg-slate-700 text-slate-200 px-1.5 py-0.2 rounded-full text-[10px]">0</span>
        </button>
      </nav>

      <!-- 右侧功能按钮 -->
      <div class="flex items-center gap-2">
        <button id="blindModeBtn" title="隐藏假名提示 (Ctrl+H)" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700/60 transition flex items-center gap-1.5">
          <span id="blindIcon">👁️</span> <span id="blindLabel">提示开</span>
        </button>
        <button id="soundToggleBtn" title="自动朗读发音" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700/60 transition flex items-center gap-1.5">
          <span>🔊</span> <span id="soundLabel">发音开</span>
        </button>
        <button onclick="openModal('cloudModal')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition flex items-center gap-1.5">
          <span>☁️</span> <span>云端词库</span>
        </button>
      </div>
    </div>

    <!-- 二级控制栏：等级选择 & 五大练习模式 -->
    <div class="border-t border-slate-800/60 bg-slate-900/50">
      <div class="max-w-6xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
        <!-- N5-N1 等级按钮 -->
        <div class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700/50" id="levelSelector">
          <button data-level="N5" class="level-btn px-3 py-1 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shadow">N5</button>
          <button data-level="N4" class="level-btn px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200">N4</button>
          <button data-level="N3" class="level-btn px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200">N3</button>
          <button data-level="N2" class="level-btn px-3 py-1 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200">N2</button>
          <button data-level="N1" class="level-btn px-3 py-
