<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイピング練習 - クラウド・データエンジニアリング演習</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --correct: #4ade80;
      --warning: #fbbf24;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
      background-color: rgba(15, 23, 42, 0.5);
      padding: 12px 20px;
      border-radius: 8px;
    }

    .stats span {
      color: var(--text-main);
      font-weight: 600;
    }

    .display-box {
      background-color: rgba(15, 23, 42, 0.8);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .hint-container {
      min-height: 50px;
      margin-bottom: 12px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .hint-container.visible {
      opacity: 1;
    }

    .hint-kana {
      font-size: 1.1rem;
      color: var(--warning);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .hint-roma {
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .target-text {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      word-break: break-all;
      text-align: center;
      line-height: 1.4;
    }

    .char {
      color: var(--text-muted);
    }

    .char.correct {
      color: var(--correct);
    }

    .char.current {
      color: var(--text-main);
      background-color: rgba(56, 189, 248, 0.3);
      border-bottom: 2px solid var(--accent);
    }

    .input-box {
      width: 100%;
      padding: 16px 20px;
