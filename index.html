<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 打字练习工具</title>
  <!-- 引入第三方开源分词引擎 Kuroshiro & Kuromoji -->
  <script src="https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    h1 { font-size: 20px; color: #1e293b; text-align: center; margin-bottom: 16px; }
    
    .custom-text-input {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      max-height: 60px;
      resize: vertical;
    }
    
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: #4f46e5;
      width: 100%;
      transition: width 0.1s linear;
    }
    .progress-bar-fill.warning { background: #ef4444; }

    /* 固定文章展示区域高度，防止遮挡输入框 */
    .text-display {
      font-size: 20px;
      line-height: 2.3;
      padding: 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      height: 220px;
      overflow-y: auto;
      scroll-behavior: smooth;
      margin-bottom: 16px;
      word-break: break-all;
      position: relative;
    }

    .word-box { position: relative; display: inline-block; margin: 0 1px; }
    .char-box { position: relative; display: inline-block; }
    .char-passed { color: #10b981; font-weight: bold; }
    .char-current {
      background: #e0e7ff;
      color: #4338ca;
      border-bottom: 3px solid #4f46e5;
      border-radius: 2px;
    }
    .hint-tooltip {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      background: #4f46e5;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 6px;
      white-space: nowrap;
      animation: bounce 1s infinite;
      z-index: 100;
    }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -4px); }
    }
    input.typing-input {
      width: 100%;
      font-size: 18px;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
    }
    input.typing-input:focus { border-color: #4f46e5; }
    .info-bar { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-top: 8px; }
    .loading {
      position: absolute;
      inset: 0;
      background: rgba(248,250,252,0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #4f46e5;
      font-weight: bold;
      border-radius: 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <h1>日本語 打字练习工具</h1>

    <div id="practice-view">
      <div class="input-section">
        <textarea id="custom-text" class="custom-text-input" placeholder="粘贴任意你想练习的日文文章...">注意事項課題の内容は授業資料に掲載しているので、授業資料を確認してください。</textarea>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div id="text-container" class="text-display">
        <div id="loading" class="loading">正在加载日文全量词典引擎...</div>
      </div>

      <input type="text" id="type-input" class="typing-input" placeholder="等待引擎加载完成..." disabled />

      <div class="info-bar">
        <span>不打字静置 5 秒自动弹出：片假名 + 罗马字</span>
        <span id="progress-text">进度: 0 / 0</span>
      </div>
    </div>
  </div>

  <script>
    let kuroshiro = null;
    let isReady = false;
    let targetText = '';
    let parsedWords = [];
    let targetIndex = 0;
    let lastActiveTime = Date.now();
    let isComposing = false;
    let isShowingHint = false;

    const customTextEl = document.getElementById('custom-text');
    const textContainer = document.getElementById('text-container');
    const typeInput = document.getElementById('type-input');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    async function initEngine() {
      try {
        kuroshiro = new Kuroshiro();
        await kuroshiro.init(new KuromojiAnalyzer({ dictPath: "https://cdn.jsdelivr.net/npm/kuromoji@0.1.5/dict" }));
        isReady = true;
        document.getElementById('loading').classList.add('hidden');
        typeInput.placeholder = "点此切换日文输入法，即可开始打字...";
        typeInput.disabled = false;
        resetGame();
      } catch (err) {
        document.getElementById('loading').innerText = "引擎加载失败，请刷新页面";
      }
    }

    async function parseText(text) {
      const tokens = await kuroshiro._analyzer.analyze(text);
      const result = [];
      let curr = 0;
      for (let t of tokens) {
        const raw = t.surface_form;
        const reading = t.reading || raw;
        const hira = Kuroshiro.Util.kanaToHira(reading);
        const kata = hira.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
        const romaji = Kuroshiro.Util.kanaToRomaji(hira);
        const start = text.indexOf(raw, curr);
        const end = start !== -1 ? start + raw.length : curr + raw.length;
        if (start !== -1) curr = end;
        result.push({ text: raw, kata, romaji, startIndex: start !== -1 ? start : curr, endIndex: end });
      }
      return result;
    }

    function renderText(showHint = false) {
      isShowingHint = showHint;
      textContainer.innerHTML = '';
      let currentElem = null;

      parsedWords.forEach(word => {
        const isCurrent = targetIndex >= word.startIndex && targetIndex < word.endIndex;
        const wordSpan = document.createElement('span');
        wordSpan.className = 'word-box';

        if (showHint && isCurrent) {
          const hint = document.createElement('div');
          hint.className = 'hint-tooltip';
          hint.innerText = `${word.kata} (${word.romaji})`;
          wordSpan.appendChild(hint);
        }

        for (let idx = word.startIndex; idx < word.endIndex; idx++) {
          const char = targetText[idx];
          const charSpan = document.createElement('span');
          charSpan.className = 'char-box';

          if (idx < targetIndex) {
            charSpan.classList.add('char-passed');
          } else if (idx === targetIndex) {
            charSpan.classList.add('char-current');
            currentElem = charSpan;
          }

          charSpan.appendChild(document.createTextNode(char));
          wordSpan.appendChild(charSpan);
        }
        textContainer.appendChild(wordSpan);
      });

      progressText.innerText = `进度: ${targetIndex} / ${targetText.length}`;

      // 自动跟随滚动
      if (currentElem) {
        const containerTop = textContainer.getBoundingClientRect().top;
        const elemTop = currentElem.getBoundingClientRect().top;
        const relativeTop = elemTop - containerTop;

        if (relativeTop < 20 || relativeTop > 160) {
          textContainer.scrollTop += (relativeTop - 80);
        }
      }
    }

    setInterval(() => {
      const remaining = Math.max(0, 5 - (Date.now() - lastActiveTime) / 1000);
      progressBar.style.width = (remaining / 5 * 100) + '%';
      if (remaining <= 2) progressBar.classList.add('warning');
      else progressBar.classList.remove('warning');
      if (remaining <= 0 && !isShowingHint) renderText(true);
    }, 100);

    function handleInput() {
      if (isComposing) return;
      const val = typeInput.value;
      const rem = targetText.slice(targetIndex);
      let matchLen = 0;

      for (let i = Math.min(val.length, rem.length); i > 0; i--) {
        if (val.slice(-i) === rem.slice(0, i)) { matchLen = i; break; }
      }

      if (matchLen > 0) {
        targetIndex += matchLen;
        typeInput.value = '';
        lastActiveTime = Date.now();
        renderText(false);
      }
    }

    async function resetGame() {
      targetText = customTextEl.value.trim() || '注意事項課題の内容は授業資料に掲載しているので、授業資料を確認してください。';
      if (isReady) parsedWords = await parseText(targetText);
      targetIndex = 0;
      typeInput.value = '';
      lastActiveTime = Date.now();
      textContainer.scrollTop = 0;
      renderText(false);
      typeInput.focus();
    }

    customTextEl.addEventListener('change', resetGame);
    typeInput.addEventListener('input', handleInput);
    typeInput.addEventListener('compositionstart', () => isComposing = true);
    typeInput.addEventListener('compositionend', () => { isComposing = false; handleInput(); });
    window.onload = initEngine;
  </script>
</body>
</html>
