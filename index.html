<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 打字练习工具</title>
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    h1 { font-size: 20px; color: #1e293b; text-align: center; margin-bottom: 16px; }

    .custom-text-input {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      height: 60px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: #4f46e5;
      width: 100%;
      transition: width 0.1s linear;
    }
    .progress-bar-fill.warning { background: #ef4444; }

    .text-display {
      font-size: 22px;
      line-height: 2.8;
      padding: 24px 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      height: 240px;
      overflow-y: auto;
      scroll-behavior: smooth;
      margin-bottom: 16px;
      word-break: break-all;
      position: relative;
    }

    .word-box { position: relative; display: inline-block; margin: 0 1px; }
    .char-box { position: relative; display: inline-block; padding: 0 1px; }
    .char-passed { color: #10b981; font-weight: bold; }
    .char-current {
      background: #e0e7ff;
      color: #4338ca;
      border-bottom: 3px solid #4f46e5;
      border-radius: 2px;
    }

    .hint-tooltip {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      background: #4f46e5;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap !important;
      word-break: keep-all !important;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
      animation: bounce 1s infinite;
      z-index: 999;
    }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -4px); }
    }

    input.typing-input {
      width: 100%;
      font-size: 18px;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
    }
    input.typing-input:focus { border-color: #4f46e5; }
    .info-bar { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>日本語 打字练习工具</h1>

    <div id="practice-view">
      <div class="input-section">
        <textarea id="custom-text" class="custom-text-input" placeholder="粘贴任意你想练习的日文文章...">注意事項（課題の内容は授業資料に掲載しているので、授業資料を確認してください）</textarea>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div id="text-container" class="text-display"></div>

      <input type="text" id="type-input" class="typing-input" placeholder="点击此处切换日文输入法开始打字..." autofocus />

      <div class="info-bar">
        <span>静置 3 秒自动弹出：片假名 + 罗马字（标点与括号自动跳过）</span>
        <span id="progress-text">进度: 0 / 0</span>
      </div>
    </div>
  </div>

  <script>
