<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 打字练习工具</title>
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    h1 { font-size: 20px; color: #1e293b; text-align: center; margin-bottom: 16px; }
    
    .custom-text-input {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      max-height: 60px;
      resize: vertical;
    }
    
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: #4f46e5;
      width: 100%;
      transition: width 0.1s linear;
    }
    .progress-bar-fill.warning { background: #ef4444; }

    .text-display {
      font-size: 20px;
      line-height: 2.8;
      padding: 24px 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      height: 230px;
      overflow-y: auto;
      scroll-behavior: smooth;
      margin-bottom: 16px;
      word-break: break-all;
      position: relative;
    }

    .word-box { position: relative; display: inline-block; margin: 0 2px; }
    .char-box { position: relative; display: inline-block; }
    .char-passed { color: #10b981; font-weight: bold; }
    .char-current {
      background: #e0e7ff;
      color: #4338ca;
      border-bottom: 3px solid #4f46e5;
      border-radius: 2px;
    }
    
    .hint-tooltip {
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
      background: #4f46e5;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 6px;
      white-space: nowrap !important;
      word-break: keep-all !important;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
      animation: bounce 1s infinite;
      z-index: 9999;
    }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, 4px); }
    }

    input.typing-input {
      width: 100%;
      font-size: 18px;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
    }
    input.typing-input:focus { border-color: #4f46e5; }
    .info-bar { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>日本語 打字练习工具</h1>

    <div id="practice-view">
      <div class="input-section">
        <textarea id="custom-text" class="custom-text-input" placeholder="粘贴任意你想练习的日文文章...">注意事項（課題の内容は授業資料に掲載しているので、授業資料を確認してください）</textarea>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div id="text-container" class="text-display"></div>

      <input type="text" id="type-input" class="typing-input" placeholder="点击此处切换日文输入法开始打字..." autofocus />

      <div class="info-bar">
        <span>不打字静置 5 秒自动弹出：片假名 + 罗马字</span>
        <span id="progress-text">进度: 0 / 0</span>
      </div>
    </div>
  </div>

  <script>
    // 基础词汇字典映射
    const LEXICON = [
      { text: '注意事項', kata: 'チュウイジコウ' },
      { text: '注意', kata: 'チュウイ' },
      { text: '事項', kata: 'ジコウ' },
      { text: '課題', kata: 'カダイ' },
      { text: '内容', kata: 'ナイヨウ' },
      { text: '授業', kata: 'ジュギョウ' },
      { text: '資料', kata: 'シリョウ' },
      { text: '掲載', kata: 'ケイサイ' },
      { text: '確認', kata: 'カクニン' },
      { text: '提出', kata: 'テイシュツ' },
      { text: '期限', kata: 'キゲン' },
      { text: '最終', kata: 'サイシュウ' },
      { text: '日本語', kata: 'ニホンゴ' },
      { text: '名前', kata: 'ナマエ' },
      { text: '勉強', kata: 'ベンキョウ' },
      { text: '学校', kata: 'ガッコウ' },
      { text: '先生', kata: 'センセイ' }
    ];

    let targetText = '';
    let parsedWords = [];
    let targetIndex = 0;
    let lastActiveTime = Date.now();
    let isComposing = false;
    let isShowingHint = false;

    const customTextEl = document.getElementById('custom-text');
    const textContainer = document.getElementById('text-container');
    const typeInput = document.getElementById('type-input');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    function isSymbolChar(ch) {
      return RegExp(/[\s\(\)\（\）\「\」\『\』\【\】\、\。\！\？\!\?\:\：\;\；]/).test(ch);
    }

    function parseTextIntoWords(fullText) {
      const result = [];
      let i = 0;

      while (i < fullText.length) {
        const char = fullText[i];

        // 1. 标点符号直接过
        if (isSymbolChar(char)) {
          result.push({
            text: char,
            kata: char,
            romaji: char,
            startIndex: i,
            endIndex: i + 1,
            isSymbol: true
          });
          i++;
          continue;
        }

        // 2. 匹配词典
        let matched = false;
        for (const wordObj of LEXICON) {
          if (fullText.startsWith(wordObj.text, i)) {
            const rom = window.wanakana ? window.wanakana.toRomaji(wordObj.kata) : wordObj.kata;
            result.push({
              text: wordObj.text,
              kata: wordObj.kata,
              romaji: rom,
              startIndex: i,
              endIndex: i + wordObj.text.length,
              isSymbol: false
            });
            i += wordObj.text.length;
            matched = true;
            break;
          }
        }

        // 3. 兜底单字处理
        if (!matched) {
          let kata = char;
          let romaji = char;
          if (window.wanakana) {
            kata = window.wanakana.toKatakana(char);
            romaji = window.wanakana.toRomaji(char);
          }
          result.push({
            text: char,
            kata: kata,
            romaji: romaji,
            startIndex: i,
            endIndex: i + 1,
            isSymbol: false
          });
          i++;
        }
      }
      return result;
    }

    function autoSkipSymbols() {
      while (targetIndex < targetText.length && isSymbolChar(targetText[targetIndex])) {
        targetIndex++;
      }
    }

    function renderText(showHint = false) {
      isShowingHint = showHint;
      textContainer.innerHTML = '';
      let currentElem = null;

      parsedWords.forEach(word => {
        const isCurrent = targetIndex >= word.startIndex && targetIndex < word.endIndex;
        const wordSpan = document.createElement('span');
        wordSpan.className = 'word-box';

        if (showHint && isCurrent && !word.isSymbol) {
          const hint = document.createElement('div');
          hint.className = 'hint-tooltip';
          hint.innerText = `${word.kata} (${word.romaji})`;
          wordSpan.appendChild(hint);
        }

        for (let idx = word.startIndex; idx < word.endIndex; idx++) {
          const char = targetText[idx];
          const charSpan = document.createElement('span');
          charSpan.className = 'char-box';

          if (idx < targetIndex) {
            charSpan.classList.add('char-passed');
          } else if (idx === targetIndex) {
            charSpan.classList.add('char-current');
            currentElem = charSpan;
          }

          charSpan.appendChild(document.createTextNode(char));
          wordSpan.appendChild(charSpan);
        }
        textContainer.appendChild(wordSpan);
      });

      progressText.innerText = `进度: ${targetIndex} / ${targetText.length}`;

      if (currentElem) {
        const containerTop = textContainer.getBoundingClientRect().top;
        const elemTop = currentElem.getBoundingClientRect().top;
        const relativeTop = elemTop - containerTop;

        if (relativeTop < 40 || relativeTop > 150) {
          textContainer.scrollTop += (relativeTop - 80);
        }
      }
    }

    setInterval(() => {
      const remaining = Math.max(0, 5 - (Date.now() - lastActiveTime) / 1000);
      progressBar.style.width = (remaining / 5 * 100) + '%';
      if (remaining <= 2) progressBar.classList.add('warning');
      else progressBar.classList.remove('warning');
      if (remaining <= 0 && !isShowingHint) renderText(true);
    }, 100);

    function handleInput() {
      if (isComposing) return;
      autoSkipSymbols();

      const val = typeInput.value;
      const rem = targetText.slice(targetIndex);
      let matchLen = 0;

      for (let i = Math.min(val.length, rem.length); i > 0; i--) {
        if (val.slice(-i) === rem.slice(0, i)) { matchLen = i; break; }
      }

      if (matchLen > 0) {
        targetIndex += matchLen;
        typeInput.value = '';
        lastActiveTime = Date.now();
        autoSkipSymbols();
        renderText(false);
      }
    }

    function resetGame() {
      targetText = customTextEl.value.trim() || '注意事項（課題の内容は授業資料に掲載しているので、授業資料を確認してください）';
      parsedWords = parseTextIntoWords(targetText);
      targetIndex = 0;
      autoSkipSymbols();
      typeInput.value = '';
      lastActiveTime = Date.now();
      textContainer.scrollTop = 0;
      renderText(false);
      typeInput.focus();
    }

    customTextEl.addEventListener('input', resetGame);
    customTextEl.addEventListener('change', resetGame);
    typeInput.addEventListener('input', handleInput);
    typeInput.addEventListener('compositionstart', () => isComposing = true);
    typeInput.addEventListener('compositionend', () => { isComposing = false; handleInput(); });

    // 确保 DOM 加载完毕后立即渲染
    document.addEventListener('DOMContentLoaded', resetGame);
    window.onload = resetGame;
  </script>
</body>
</html>
