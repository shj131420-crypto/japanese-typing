<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 打字练习工具</title>
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    h1 { font-size: 20px; color: #1e293b; text-align: center; margin-bottom: 16px; }

    .input-section {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .custom-text-input {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      height: 64px;
      resize: vertical;
    }

    .parse-btn {
      width: 130px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .parse-btn:hover { background: #4338ca; }
    .parse-btn:disabled { background: #94a3b8; cursor: not-allowed; }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: #4f46e5;
      width: 100%;
      transition: width 0.1s linear;
    }
    .progress-bar-fill.warning { background: #ef4444; }

    .text-display {
      font-size: 22px;
      line-height: 2.8;
      padding: 24px 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      height: 240px;
      overflow-y: auto;
      scroll-behavior: smooth;
      margin-bottom: 16px;
      word-break: break-all;
      position: relative;
    }

    .word-box { position: relative; display: inline-block; margin: 0 1px; }
    .char-box { position: relative; display: inline-block; padding: 0 1px; }
    .char-passed { color: #10b981; font-weight: bold; }
    .char-current {
      background: #e0e7ff;
      color: #4338ca;
      border-bottom: 3px solid #4f46e5;
      border-radius: 2px;
    }
    .char-symbol { color: #94a3b8; opacity: 0.5; }

    .hint-tooltip {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      background: #4f46e5;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap !important;
      word-break: keep-all !important;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
      animation: bounce 1s infinite;
      z-index: 999;
    }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -4px); }
    }

    input.typing-input {
      width: 100%;
      font-size: 18px;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
    }
    input.typing-input:focus { border-color: #4f46e5; }
    .info-bar { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>日本語 打字练习工具</h1>

    <div id="practice-view">
      <div class="input-section">
        <textarea id="custom-text" class="custom-text-input" placeholder="粘贴任意你想练习的课文或文章...">[クラウド・データエンジニアリング演習 第1回] イントロダクション</textarea>
        <button id="parse-btn" class="parse-btn" onclick="autoAnalyzeText()">⚡ 识别课文读音</button>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div id="text-container" class="text-display"></div>

      <input type="text" id="type-input" class="typing-input" placeholder="点击此处切换日文输入法开始打字..." autofocus />

      <div class="info-bar">
        <span>静置 3 秒自动弹出提示（标点与括号自动跳过）</span>
        <span id="progress-text">进度: 0 / 0</span>
      </div>
    </div>
  </div>

  <script>
    let targetText = '';
    let parsedWords = [];
    let targetIndex = 0;
    let lastActiveTime = Date.now();
    let isComposing = false;
    let isShowingHint = false;

    const customTextEl = document.getElementById('custom-text');
    const textContainer = document.getElementById('text-container');
    const typeInput = document.getElementById('type-input');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const parseBtn = document.getElementById('parse-btn');

    // 绝大多数中日文标点、括号与符号自动跳过免打
    function isSymbolChar(ch) {
      return /[\s\(\)\（\）\[\]【】\{\}\<\>《》「」『』\、\。\！\？\!\?\:\：\;\；\-\—\~\～\…]/.test(ch);
    }

    // 自动在线获取课文中汉字的假名与罗马字读音
    async function autoAnalyzeText() {
      const rawText = customTextEl.value.trim();
      if (!rawText) return;

      parseBtn.disabled = true;
      parseBtn.innerText = "⏳ 正在识别中...";

      try {
        // 请求高可用日文注音 API 服务
        const response = await fetch(`https://api.jisho.org/api/v1/search/words?keyword=${encodeURIComponent(rawText)}`).catch(() => null);
        
        // 使用高效简捷的分词识别
        parsedWords = await parseTextWithAPI(rawText);
      } catch (e) {
        parsedWords = parseFallback(rawText);
      }

      parseBtn.disabled = false;
      parseBtn.innerText = "⚡ 识别课文读音";
      
      targetIndex = 0;
      autoSkipSymbols();
      typeInput.value = '';
      lastActiveTime = Date.now();
      textContainer.scrollTop = 0;
      renderText(false);
      typeInput.focus();
    }

    // 智能分析课文结构（支持汉字自动转片假名+罗马字）
    async function parseTextWithAPI(fullText) {
      const result = [];
      
      // 免费公共日文分词解析 API 接口
      try {
        const res = await fetch(`https://labs.goo.ne.jp/api/hiragana`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `app_id=demo&sentence=${encodeURIComponent(fullText)}&output_type=katakana`
        }).catch(() => null);

        // 如果获取到了整篇注音
        if (res && res.ok) {
          const data = await res.json();
          if (data && data.converted) {
            const katakanaStr = data.converted;
            // 匹配构建
            return buildWordsFromKatakana(fullText, katakanaStr);
          }
        }
      } catch(e) {}

      // 降级兜底处理
      return parseFallback(fullText);
    }

    function buildWordsFromKatakana(fullText, katakanaStr) {
      const result = [];
      for (let i = 0; i < fullText.length; i++) {
        const char = fullText[i];
        const isSym = isSymbolChar(char);
        let kata = char;
        let romaji = char;

        if (!isSym && window.wanakana) {
          try {
            // 如果是假名或已知字，自动转换罗马字
            kata = window.wanakana.toKatakana(char);
            romaji = window.wanakana.toRomaji(char);
            if (romaji === char && i < katakanaStr.length) {
              // 从 API 转换结果中取对应位置的片假名
              kata = katakanaStr[i] || char;
              romaji = window.wanakana.toRomaji(kata);
            }
          } catch(e){}
        }

        result.push({
          text: char,
          kata: kata,
          romaji: romaji,
          startIndex: i,
          endIndex: i + 1,
          isSymbol: isSym
        });
      }
      return result;
    }

    function parseFallback(fullText) {
      const result = [];
      for (let i = 0; i < fullText.length; i++) {
        const char = fullText[i];
        const isSym = isSymbolChar(char);
        let kata = char;
        let romaji = char;

        if (!isSym && window.wanakana) {
          try {
            kata = window.wanakana.toKatakana(char);
            romaji = window.wanakana.toRomaji(char);
          } catch(e){}
        }

        result.push({
          text: char,
          kata: kata,
          romaji: romaji,
          startIndex: i,
          endIndex: i + 1,
          isSymbol: isSym
        });
      }
      return result;
    }

    function autoSkipSymbols() {
      while (targetIndex < targetText.length && isSymbolChar(targetText[targetIndex])) {
        targetIndex++;
      }
    }

    function renderText(showHint = false) {
      isShowingHint = showHint;
      textContainer.innerHTML = '';
      let currentElem = null;

      parsedWords.forEach(word => {
        const isCurrent = targetIndex >= word.startIndex && targetIndex < word.endIndex;
        const wordSpan = document.createElement('span');
        wordSpan.className = 'word-box';

        if (showHint && isCurrent && !word.isSymbol) {
          const hint = document.createElement('div');
          hint.className = 'hint-tooltip';
          hint.innerText = `${word.kata} (${word.romaji})`;
          wordSpan.appendChild(hint);
        }

        for (let idx = word.startIndex; idx < word.endIndex; idx++) {
          const char = targetText[idx];
          const charSpan = document.createElement('span');
          charSpan.className = 'char-box';

          if (isSymbolChar(char
