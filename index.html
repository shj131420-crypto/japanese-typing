<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 打字练习工具</title>
  <!-- 引入日文分词与转换库 -->
  <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      position: relative;
    }
    h1 { font-size: 20px; color: #1e293b; text-align: center; margin-bottom: 16px; }

    /* 字典加载提示 */
    .loading-status {
      text-align: center;
      font-size: 13px;
      color: #4f46e5;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .custom-text-input {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      height: 60px;
      resize: vertical;
      margin-bottom: 12px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: #4f46e5;
      width: 100%;
      transition: width 0.1s linear;
    }
    .progress-bar-fill.warning { background: #ef4444; }

    .text-display {
      font-size: 22px;
      line-height: 2.8;
      padding: 24px 16px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      height: 240px;
      overflow-y: auto;
      scroll-behavior: smooth;
      margin-bottom: 16px;
      word-break: break-all;
      position: relative;
    }

    .word-box { position: relative; display: inline-block; margin: 0 1px; }
    .char-box { position: relative; display: inline-block; padding: 0 1px; }
    .char-passed { color: #10b981; font-weight: bold; }
    .char-current {
      background: #e0e7ff;
      color: #4338ca;
      border-bottom: 3px solid #4f46e5;
      border-radius: 2px;
    }
    .char-symbol { color: #94a3b8; opacity: 0.5; }

    .hint-tooltip {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      background: #4f46e5;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap !important;
      word-break: keep-all !important;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
      animation: bounce 1s infinite;
      z-index: 999;
    }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -4px); }
    }

    input.typing-input {
      width: 100%;
      font-size: 18px;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
    }
    input.typing-input:focus { border-color: #4f46e5; }
    .info-bar { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>日本語 打字练习工具</h1>
    <div id="status-tip" class="loading-status">⌛ 正在载入日文汉字识别字典，请稍候...</div>

    <div id="practice-view">
      <div class="input-section">
        <textarea id="custom-text" class="custom-text-input" placeholder="粘贴任意你想练习的日文文章...">[クラウド・データエンジニアリング演習 第1回] イントロダクション</textarea>
      </div>

      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div id="text-container" class="text-display"></div>

      <input type="text" id="type-input" class="typing-input" placeholder="点击此处切换日文输入法开始打字..." autofocus />

      <div class="info-bar">
        <span>静置 3 秒自动弹出提示（标点与括号自动跳过）</span>
        <span id="progress-text">进度: 0 / 0</span>
      </div>
    </div>
  </div>

  <script>
    let tokenizer = null;
    let targetText = '';
    let parsedWords = [];
    let targetIndex = 0;
    let lastActiveTime = Date.now();
    let isComposing = false;
    let isShowingHint = false;

    const customTextEl = document.getElementById('custom-text');
    const textContainer = document.getElementById('text-container');
    const typeInput = document.getElementById('type-input');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const statusTip = document.getElementById('status-tip');

    // 绝大多数标点、空格与括号自动免打
    function isSymbolChar(ch) {
      return /[\s\(\)\（\）\[\]【】\{\}\<\>《》「」『』\、\。\！\？\!\?\:\：\;\；\-\—\~\～\…]/.test(ch);
    }

    function parseTextIntoWords(fullText) {
      const result = [];

      // 如果自动识别字典已经加载完毕
      if (tokenizer) {
        const tokens = tokenizer.tokenize(fullText);
        let currentIndex = 0;

        tokens.forEach(token => {
          const text = token.surface_form;
          const len = text.length;
          const startIndex = currentIndex;
          const endIndex = currentIndex + len;
          currentIndex = endIndex;

          if (len === 1 && isSymbolChar(text)) {
            result.push({ text, kata: text, romaji: text, startIndex, endIndex, isSymbol: true });
            return;
          }

          let kata = token.reading || text;
          let romaji = text;
          if (window.wanakana) {
            try { romaji = window.wanakana.toRomaji(kata); } catch(e) {}
          }

          result.push({ text, kata, romaji, startIndex, endIndex, isSymbol: false });
        });
        return result;
      }

      // 如果字典还没加载好，降级为单字显示（防止页面空白）
      for (let i = 0; i < fullText.length; i++) {
        const ch = fullText[i];
        const isSym = isSymbolChar(ch);
        let rom = ch;
        if (window.wanakana) {
          try { rom = window.wanakana.toRomaji(ch); } catch(e){}
        }
        result.push({ text: ch, kata: ch, romaji: rom, startIndex: i, endIndex: i + 1, isSymbol: isSym });
      }
      return result;
    }

    function autoSkipSymbols() {
      while (targetIndex < targetText.length && isSymbolChar(targetText[targetIndex])) {
        targetIndex++;
      }
    }

    function renderText(showHint = false) {
      isShowingHint = showHint;
      textContainer.innerHTML = '';
      let currentElem = null;

      parsedWords.forEach(word => {
        const isCurrent = targetIndex >= word.startIndex && targetIndex < word.endIndex;
        const wordSpan = document.createElement('span');
        wordSpan.className = 'word-box';

        if (showHint && isCurrent && !word.isSymbol) {
          const hint = document.createElement('div');
          hint.className = 'hint-tooltip';
          hint.innerText = `${word.kata} (${word.romaji})`;
          wordSpan.appendChild(hint);
        }

        for (let idx = word.startIndex; idx < word.endIndex; idx++) {
          const char = targetText[idx];
          const charSpan = document.createElement('span');
          charSpan.className = 'char-box';

          if (isSymbolChar(char)) {
            charSpan.classList.add('char-symbol');
          } else if (idx < targetIndex) {
            charSpan.classList.add('char-passed');
          } else if (idx === targetIndex) {
            charSpan.classList.add('char-current');
            currentElem = charSpan;
          }

          charSpan.appendChild(document.createTextNode(char));
          wordSpan.appendChild(charSpan);
        }
        textContainer.appendChild(wordSpan);
      });

      progressText.innerText = `进度: ${targetIndex} / ${targetText.length}`;

      if (currentElem) {
        const containerTop = textContainer.getBoundingClientRect().top;
        const elemTop = currentElem.getBoundingClientRect().top;
        const relativeTop = elemTop - containerTop;

        if (relativeTop < 40 || relativeTop > 150) {
          textContainer.scrollTop += (relativeTop - 80);
        }
      }
    }

    function handleInput() {
      if (isComposing) return;
      autoSkipSymbols();

      const val = typeInput.value;
      const rem = targetText.slice(targetIndex);
      let matchLen = 0;

      for (let i = Math.min(val.length, rem.length); i > 0; i--) {
        if (val.slice(-i) === rem.slice(0, i)) { matchLen = i; break; }
      }

      if (matchLen > 0) {
        targetIndex += matchLen;
        typeInput.value = '';
        lastActiveTime = Date.now();
        autoSkipSymbols();
        renderText(false);
      }
    }

    function resetGame() {
      targetText = customTextEl.value.trim() || '[クラウド・データエンジニアリング演習 第1回] イントロダクション';
      parsedWords = parseTextIntoWords(targetText);
      targetIndex = 0;
      autoSkipSymbols();
      typeInput.value = '';
      lastActiveTime = Date.now();
      textContainer.scrollTop = 0;
      renderText(false);
      typeInput.focus();
    }

    // 加载自动识别字典
    function loadDictionary() {
      if (typeof kuromoji === '
