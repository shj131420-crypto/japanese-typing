<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本語 打字练习工具</title>
  <!-- 引入 Kuromoji 日文分词/注音库 和 Wanakana 罗马字转换库 -->
  <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 800px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      position: relative;
    }
    h1 { font-size: 20px; color: #1e293b; text-align: center; margin-bottom: 16px; }

    /* 字典加载掩膜 */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      font-size: 14px;
      color: #4f46e5;
      font-weight: 600;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e0e7ff;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .custom-text-input {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      height: 60px;
      resize: vertical;
      margin-bottom: 12px;
    }
